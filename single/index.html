<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Plan your preparation, analyze every exam, and turn mistakes into your next study plan." />
    <meta name="theme-color" content="#f2f2f7" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap" />
    <title>Exam Pilot</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230a66e0'/%3E%3Cpath d='M9 21.5 16 8l7 13.5-7-3.2z' fill='%23fff'/%3E%3C/svg%3E" />
    <script>
      (function () {
        try {
          var t = localStorage.getItem("exam-pilot-theme") || "system";
          var d = t === "dark" || (t === "system" && matchMedia("(prefers-color-scheme: dark)").matches);
          document.documentElement.dataset.theme = d ? "dark" : "light";
        } catch (e) {
          document.documentElement.dataset.theme = "light";
        }
      })();
    </script>
  </head>
  <body class="min-h-dvh">
    <div id="root"></div>
    <noscript>Exam Pilot needs JavaScript enabled.</noscript>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
